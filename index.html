  mus=ac.createGain();mus.gain.value=.5;mus.connect(mg);nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);

function osc(type,f1,f2,d,v,dl=0,dest){if(!O())return;const t=ac.currentTime+dl,o=ac.createOscillator(),n=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t+d);

  n.connect(mg);o.start(t);o.stop(t+d+.05)}
function oud(f,d,v,dl=0,dest){if(!O())return;const t=ac.currentTime+dl,o=ac.createOscillator(),fl=ac.createBiquadFilter(),n=ac.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(f*1.035,t);o.frequency.exponentialRampToValueAtTime(f,t+.04);
